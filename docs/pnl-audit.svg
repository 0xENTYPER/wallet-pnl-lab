<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
  <title id="t">Wallet PnL audit view</title><desc id="d">A realized PnL calendar separates verified gains from unknown-cost and oversold exits while showing coverage.</desc>
